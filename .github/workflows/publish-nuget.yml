name: Publish NuGet package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed to verify the tag is on master

      - name: Verify tag is on master
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on master. Aborting publish."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore BudgetBakers.Wallet.Net.slnx

      - name: Build
        run: dotnet build BudgetBakers.Wallet.Net.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test src/BudgetBakers.Wallet.Net.Tests/BudgetBakers.Wallet.Net.Tests.csproj --configuration Release --no-build /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack src/BudgetBakers.Wallet.Net/BudgetBakers.Wallet.Net.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
